    <circle id="mora2c" class="pieza" data-color="#6e2869" cx="419" cy="178" r="25"/>
    <circle id="mora2d" class="pieza" data-color="#82347d" cx="390" cy="200" r="27"/>
    <circle id="mora2e" class="pieza" data-color="#82347d" cx="390" cy="178" r="22"/>
  </g>

  <g id="mora3">
    <circle id="mora3a" class="pieza" data-color="#51204f" cx="507" cy="205" r="27"/>
    <circle id="mora3b" class="pieza" data-color="#6e2869" cx="478" cy="221" r="25"/>
    <circle id="mora3c" class="pieza" data-color="#6e2869" cx="536" cy="223" r="25"/>
    <circle id="mora3d" class="pieza" data-color="#82347d" cx="507" cy="244" r="27"/>
    <circle id="mora3e" class="pieza" data-color="#82347d" cx="507" cy="222" r="22"/>
  </g>

  <g id="mora4">
