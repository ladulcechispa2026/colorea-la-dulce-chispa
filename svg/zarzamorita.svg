    <circle id="mora4b" class="pieza" data-color="#6e2869" cx="330" cy="260" r="23"/>
    <circle id="mora4c" class="pieza" data-color="#6e2869" cx="380" cy="260" r="23"/>
    <circle id="mora4d" class="pieza" data-color="#82347d" cx="355" cy="278" r="24"/>
  </g>

  <g id="mora5">
    <circle id="mora5a" class="pieza" data-color="#51204f" cx="455" cy="255" r="24"/>
    <circle id="mora5b" class="pieza" data-color="#6e2869" cx="430" cy="270" r="23"/>
    <circle id="mora5c" class="pieza" data-color="#6e2869" cx="480" cy="270" r="23"/>
    <circle id="mora5d" class="pieza" data-color="#82347d" cx="455" cy="288" r="24"/>
  </g>

  <!-- Detalles -->
