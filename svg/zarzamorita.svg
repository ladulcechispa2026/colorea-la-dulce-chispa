  <path class="detalle" d="M235 462 Q270 480 305 486"/>
  <path class="detalle" d="M332 493 Q370 502 408 502"/>
  <path class="detalle" d="M438 500 Q478 496 515 482"/>

  <ellipse class="brillo" cx="270" cy="211" rx="6" ry="9" transform="rotate(-35 270 211)"/>
  <ellipse class="brillo" cx="380" cy="157" rx="6" ry="9" transform="rotate(-35 380 157)"/>
  <ellipse class="brillo" cx="497" cy="202" rx="6" ry="9" transform="rotate(-35 497 202)"/>
</svg>
